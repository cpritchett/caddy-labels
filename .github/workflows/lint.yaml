name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same workflow on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'

      - name: Socket Security
        uses: SocketDev/action@937f824ec476dfd164d4a4d9995751427b0be143 # v1
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw bun install

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Lint Markdown
        run: bun run lint:markdown

      - name: Lint YAML
        run: bun run lint:yaml

      - name: Check commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          bunx --bun commitlint --from main --to HEAD
